name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  # Manual "Run workflow" button in the Actions tab.
  workflow_dispatch:

  # Rebuild weekly (Monday 06:17 UTC) so course changes reach the sitemap
  # without touching this repo.
  schedule:
    - cron: '17 6 * * 1'

  # Lets a course repo trigger a rebuild right after it changes (optional).
  repository_dispatch:
    types: [course-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Check out course repositories
        run: |
          mkdir -p ../courses
          for repo in ISO-8583-jPOS-tutorial \
                      Claude-Certification-Preparation-Developer-to-Architect \
                      Claude-senior-java-engineer; do
            git clone --depth 1 "https://github.com/msorkhpar/$repo.git" "../courses/$repo"
          done

      # Reads each course's own GitHub Pages workflow, replays its build steps,
      # and lists every page that workflow publishes.
      - name: Generate sitemap.xml
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/generate_sitemap.py public/sitemap.xml . \
            ../courses/ISO-8583-jPOS-tutorial \
            ../courses/Claude-Certification-Preparation-Developer-to-Architect \
            ../courses/Claude-senior-java-engineer

      - name: Build with vite
        run: |
          echo "CLARITY_ID=${{ vars.CLARITY_ID }}" >> .env
          CLARITY_ID=${{ vars.CLARITY_ID }} npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
